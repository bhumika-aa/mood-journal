<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In  Mood Journal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/landing.css">
</head>
<body class="auth-page">

    <!-- Minimal Navbar -->
    <nav class="auth-navbar">
        <a href="/" class="logo">Mood Journal</a>
        <div style="display:flex; gap:12px; align-items:center;">
            <span style="font-size:0.875rem; color:#6B7280;">Don't have an account?</span>
            <a href="/register" class="auth-nav-action auth-nav-primary">Sign Up</a>
        </div>
    </nav>

    <!-- Card -->
    <main class="auth-main">
        <div class="auth-card">

            <div class="auth-badge"> Secure Login</div>
            <h1 class="auth-title">Welcome back</h1>
            <p class="auth-subtitle">Log in to continue your journaling journey.</p>

            <form method="POST" action="/login" class="auth-form">
                <div class="form-field">
                    <label for="email">Email address</label>
                    <input type="email" id="email" name="email" required placeholder="you@example.com" autocomplete="email">
                </div>

                <div class="form-field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="" autocomplete="current-password">
                </div>

                <button type="submit" class="auth-submit-btn">Log In </button>
            </form>

        </div>

        <p class="auth-footer-link">
            New here? <a href="/register">Create a free account</a>
        </p>
    </main>

</body>
</html>
